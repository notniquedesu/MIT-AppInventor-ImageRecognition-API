version: '3.8'

services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
    volumes:
      - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mock-api:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app
    command: node mock-server.js
    ports:
      - "5001:5001"
    restart: unless-stopped